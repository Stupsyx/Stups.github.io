<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stups</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #000;
        --text: #fff;
        --accent: #7efcff;
        --btn-bg: rgba(255, 255, 255, 0.08);
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        display: grid;
        place-items: center;
        font-family: 'Poppins', sans-serif;
        color: var(--text);
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: 28px;
      }
      .stups {
        display: inline-block;
        font-weight: 800;
        font-size: clamp(42px, 9vw, 160px);
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-align: center;
        padding: 16px 20px;
        transition: transform 220ms cubic-bezier(.2,.9,.3,1), filter 220ms;
        transform: scale(1);
        will-change: transform, filter;
        -webkit-font-smoothing: antialiased;
        background: linear-gradient(90deg, #ff8040 0%, #ff3f66 45%, #06b6d4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow:
          0 0 8px rgba(126,252,255,0.14),
          0 0 28px rgba(126,252,255,0.08),
          0 12px 40px rgba(0,0,0,0.6);
      }
      .stups:hover {
        transform: scale(1.06);
        filter: drop-shadow(0 8px 36px rgba(126,252,255,0.35));
      }
      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-radius: 16px;
        border: 1px solid rgba(126, 252, 255, 0.25);
        background: var(--btn-bg);
        color: var(--text);
        text-decoration: none;
        font-size: 18px;
        font-weight: 700;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      .download-btn::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }
      .download-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 16px 46px rgba(126,252,255,0.22);
        border-color: rgba(126,252,255,0.7);
        background: rgba(255,255,255,0.12);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="stups">Stups</h1>
      <a class="download-btn" href="https://mega.nz/fm/RnUmBTzZ" target="_blank" rel="noopener">Download</a>
    </div>
  </body>
</html>
