<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stups</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0c0d0c;
        --text: #fff;
        --accent: #7efcff;
        --btn-bg: rgba(255, 255, 255, 0.08);
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        display: grid;
        place-items: center;
        font-family: 'Poppins', sans-serif;
        color: var(--text);
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: 28px;
      }
      .stups {
        display: inline-block;
        font-weight: 800;
        font-size: clamp(42px, 9vw, 160px);
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-align: center;
        padding: 16px 20px;
        transition: transform 220ms cubic-bezier(.2,.9,.3,1), filter 220ms;
        transform: scale(1);
        will-change: transform, filter;
        -webkit-font-smoothing: antialiased;
        background: none;
        color: #FFD400;
        text-shadow:
          0 0 12px rgba(255,212,0,0.95),
          0 0 24px rgba(255,212,0,0.6),
          0 12px 40px rgba(0,0,0,0.6);
      }
      .stups:hover {
        transform: scale(1.06);
        filter: drop-shadow(0 8px 36px rgba(126,252,255,0.35));
      }
      #st-img {
        position: fixed;
        top: 20px;
        left: 20px;
        width: clamp(56px, 8vw, 120px);
        height: auto;
        z-index: 1000;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.55);
        pointer-events: none;
        -webkit-user-drag: none;
      }
      @media (max-width: 420px) {
        #st-img {
          top: 12px;
          left: 12px;
          width: clamp(40px, 14vw, 72px);
        }
      }
      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-radius: 16px;
        border: 1px solid rgba(126, 252, 255, 0.25);
        background: var(--btn-bg);
        color: var(--text);
        text-decoration: none;
        font-size: 18px;
        font-weight: 700;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      .download-btn::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }
      .download-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 16px 46px rgba(126,252,255,0.22);
        border-color: rgba(126,252,255,0.7);
        background: rgba(255,255,255,0.12);
      }
    </style>
  </head>
  <body>
    <img id="st-img" src="St.png" alt="St logo" aria-hidden="true" draggable="false">
    <div class="container">
      <h1 class="stups">Stups</h1>
      <a class="download-btn" href="https://mega.nz/fm/RnUmBTzZ" target="_blank" rel="noopener">Download</a>
    </div>
    <script>
      function setBackgroundFromImage(img) {
        try {
          var canvas = document.createElement('canvas');
          var size = 64;
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          var data = ctx.getImageData(0, 0, size, size).data;
          var r = 0, g = 0, b = 0, count = 0;
          for (var i = 0; i < data.length; i += 4) {
            var alpha = data[i+3];
            if (alpha < 128) continue;
            r += data[i]; g += data[i+1]; b += data[i+2]; count++;
          }
          if (count === 0) return;
          r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
          var hex = '#' + [r, g, b].map(function(v){ return v.toString(16).padStart(2, '0'); }).join('');
          // keep background fixed to the chosen color; do not override --bg
          var lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
          document.documentElement.style.setProperty('--text', lum > 0.6 ? '#000' : '#fff');
        } catch (e) {
          console.warn('Could not sample image color', e);
        }
      }

      window.addEventListener('load', function(){
        var img = document.getElementById('st-img');
        if (!img) return;
        if (img.complete && img.naturalWidth) setBackgroundFromImage(img);
        else img.addEventListener('load', function(){ setBackgroundFromImage(img); });
      });
    </script>
  </body>
</html>
